<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Katarata</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <h2>🏪 Tienda</h2>
        <p>Katarata</p>
        <p id="campana-indicator" class="campana-badge">📅 Campaña N° <span id="campana-numero">1</span></p>
      </div>
      <nav class="menu">
        <ul>
          <li class="active" data-view="dashboard">📊 Dashboard</li>
          <li data-view="productos">📦 Productos</li>
          <li data-view="ingresos">📥 Ingresos</li>
          <li data-view="personal">👨‍💼 Personal</li>
          <li data-view="comida">🍽️ Comida</li>
          <li data-view="ventas">💰 Ventas</li>
          <li data-view="deudas">📋 Deudas</li>
          <li data-view="reportes">📈 Reportes</li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <header class="top-bar">
        <h1 id="page-title">Dashboard</h1>
        <div class="header-info">
          <span id="date-display"></span>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <!-- Modal Personal -->
  <div id="modal-personal" class="modal">
    <div class="modal-content">
      <h3 id="modal-titulo-personal">Nuevo Personal</h3>
      <form id="form-personal" onsubmit="guardarPersonal(event)">
        <input type="hidden" id="personal-codigo-original">
        <div class="form-group">
          <label>Código</label>
          <input type="text" id="personal-codigo" readonly style="background:#f0f0f0;width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div class="form-group">
          <label>Nombres y Apellidos</label>
          <input type="text" id="personal-nombres" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div class="form-group">
          <label>DNI</label>
          <input type="text" id="personal-dni" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div class="form-group">
          <label>Área de Trabajo</label>
          <input type="text" id="personal-area" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div style="display:flex; gap:10px; margin-top:20px">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn" onclick="closeModal('personal')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Producto -->
  <div id="modal-producto" class="modal">
    <div class="modal-content">
      <h3 id="modal-titulo-producto">Nuevo Producto</h3>
      <form id="form-producto" onsubmit="guardarProducto(event)">
        <input type="hidden" id="producto-sku">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="producto-nombre" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="producto-categoria" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
            <option value="Bebida">Bebida</option>
            <option value="Snack">Snack/Galleta</option>
            <option value="Panadería">Panadería/Dulce</option>
            <option value="Chocolate">Chocolate/Caramelo</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="producto-stock" value="0" min="0" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div class="form-group">
          <label>Precio de Compra (S/)</label>
          <input type="number" id="producto-precio-compra" step="0.10" value="0" min="0" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div class="form-group">
          <label>Precio de Venta (S/)</label>
          <input type="number" id="producto-precio-venta" step="0.10" value="0" min="0" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div style="display:flex; gap:10px; margin-top:20px">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn" onclick="closeModal('producto')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Número de Campaña -->
  <div id="modal-campana" class="modal">
    <div class="modal-content" style="max-width:400px">
      <h3>📅 Cerrar Campaña</h3>
      <p style="margin:10px 0;color:#666">Ingrese el número de campaña para esta exportación:</p>
      <div class="form-group">
        <label>N° de Campaña</label>
        <input type="number" id="campana-numero-input" min="1" value="1" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:1.1rem">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px">
        <button class="btn btn-primary" onclick="confirmarCierreConCampana()">✅ Cerrar Campaña</button>
        <button class="btn" onclick="closeModal('campana')">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Pago -->
  <div id="modal-pago" class="modal">
    <div class="modal-content">
      <h3>Registrar Pago</h3>
      <form id="form-pago" onsubmit="guardarPago(event)">
        <input type="hidden" id="pago-personal-codigo">
        <div class="form-group">
          <label>Monto a Pagar (S/)</label>
          <input type="number" name="monto" step="0.10" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">
        </div>
        <div style="display:flex; gap:10px; margin-top:20px">
          <button type="submit" class="btn btn-success">Registrar</button>
          <button type="button" class="btn" onclick="closeModal('pago')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
